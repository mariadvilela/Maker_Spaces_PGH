<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.P.I.E.S. Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styling.css">
<link rel="stylesheet" href="css/radio.css">
</head>
<body>
    <div class="terminal">
        <div class="scanlines"></div>
        <main class="screen radio-screen">
            <a class="back-link" href="home.html">&larr; Home</a>

            <div class="content radio-content">

                <h1 class="radio-title">Radio</h1>

                <div class="cassette-wrap" id="cassette-wrap">
                    <img class="cassette" src="images/radio/Casette.png" alt="">
                    <div class="cassette-label" id="cassette-label"></div>
                </div>

                <p class="track-count" id="track-count"></p>

                <div class="seek-row">
                    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" disabled aria-label="Seek">
                    <div class="time" id="time">0:00 / 0:00</div>
                </div>

                <div class="controls">
                    <button type="button" id="prev" aria-label="Previous track">
                        <img src="images/radio/ArrowLeft.png" alt="">
                    </button>
                    <button type="button" id="play" aria-label="Play">
                        <img id="play-icon" src="images/radio/play.png" alt="">
                    </button>
                    <button type="button" id="next" aria-label="Next track">
                        <img src="images/radio/ArrowRight.png" alt="">
                    </button>
                </div>

                <p class="status" id="status" role="status"></p>

                <audio id="player" preload="metadata"></audio>

            </div>
        </main>
    </div>
    <script src="js/radio.js"></script>
</body>
</html>
